spring.application.name=gestionweb

# port du site web (8080 est déjà occupé sur le poste de développement par Docker, l'API est sur 9999)
server.port=9998

# adresse de l'API REST gestionfioul, utilisée par le site à partir de l'étape 2
gestionfioul.api.url=${GESTIONFIOUL_API_URL:http://localhost:9999}

# Thymeleaf : pas de cache en développement pour voir les modifications des templates sans redémarrer
spring.thymeleaf.cache=false

# fichiers statiques (étape 8) : on lit D'ABORD le dossier des sources, puis le classpath.
# Le CLI Tailwind (npm run watch:css) régénère src/main/resources/static/css/app.css ; sans cette ligne,
# le site servirait la copie de target/classes, mise à jour seulement au prochain build.
# Chemin relatif au dossier de lancement (racine du projet) ; s'il n'existe pas (jar en production), le classpath prend le relais.
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
