# Messages lus par le MessageSource de Spring Boot (fichier détecté automatiquement).
# typeMismatch : erreur de CONVERSION, avant toute validation ("abc" ne peut pas devenir un Integer).
# Clé la plus précise : typeMismatch.<objet du formulaire>.<champ>
typeMismatch.participation.volumeSouhaite=Le volume doit être un nombre entier de litres
# Clés générales, par type Java du champ
typeMismatch.java.lang.Integer=Ce champ doit être un nombre entier
typeMismatch.java.math.BigDecimal=Ce champ doit être un nombre (exemple : 1.05)
typeMismatch.java.time.LocalDateTime=Date et heure invalides
