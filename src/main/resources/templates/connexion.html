<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Connexion — Gestion Fioul</title>
</head>
<body>
<main class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-xl shadow p-8">
        <h1 class="text-2xl font-bold text-slate-900">Connexion</h1>

        <p th:if="${erreur}" th:text="${erreur}"
           class="mt-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800">
            Email ou mot de passe incorrect.
        </p>
        <p th:if="${info}" th:text="${info}"
           class="mt-4 rounded-lg bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800">
            Vous êtes déconnecté.
        </p>

        <!--/*
          th:action (et non action) : Thymeleaf ajoute automatiquement un champ caché _csrf
          contenant le jeton CSRF. Sans lui, Spring Security refuserait le POST (403).
          Les noms des champs (email, motDePasse) sont ceux déclarés dans SecurityConfig.
        */-->
        <form th:action="@{/connexion}" method="post" class="mt-6 space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
                <!--/* pré-rempli après une inscription (attribut flash "email") */-->
                <input id="email" name="email" type="email" required autofocus autocomplete="username"
                       th:value="${email}"
                       class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 focus:outline-none">
            </div>
            <div>
                <label for="motDePasse" class="block text-sm font-medium text-slate-700">Mot de passe</label>
                <input id="motDePasse" name="motDePasse" type="password" required autocomplete="current-password"
                       class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 focus:outline-none">
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-amber-600 px-4 py-2 font-medium text-white hover:bg-amber-700">
                Se connecter
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
            Pas encore de compte ? <a th:href="@{/inscription}" class="font-medium text-amber-700 hover:underline">Créer un compte</a>
        </p>
    </div>
</main>
</body>
</html>
