<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Erreur — Gestion Fioul</title>
</head>
<body>
<main class="max-w-2xl mx-auto px-4 py-16">
    <div class="bg-white rounded-xl shadow p-8 border-l-4 border-red-500">
        <p class="text-sm font-semibold text-red-600">
            Erreur <span th:text="${statut}">500</span>
        </p>
        <h1 class="mt-1 text-2xl font-bold text-slate-900">Une erreur est survenue</h1>
        <p class="mt-4 text-slate-700" th:text="${message}">Message d'erreur</p>
        <a th:href="@{/}"
           class="inline-block mt-6 rounded-lg bg-amber-600 px-4 py-2 text-white font-medium hover:bg-amber-700">
            Retour à l'accueil
        </a>
    </div>
</main>
</body>
</html>
