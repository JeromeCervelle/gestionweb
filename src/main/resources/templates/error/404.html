<!DOCTYPE html>
<!--/*
  Page 404 du SITE (adresse inconnue), trouvée par Spring Boot selon la même convention que error/403.html.
  Sans elle, le visiteur voyait la page « Whitelabel Error Page » en anglais (découvert par GestionwebApplicationTest,
  étape 9 : MockMvc ne passe pas par le contrôleur d'erreur de Spring Boot).
  Variables fournies par Spring Boot : status, error, path, timestamp.
*/-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Page introuvable — Gestion Fioul</title>
</head>
<body>
<main class="max-w-2xl mx-auto px-4 py-16">
    <div class="bg-white rounded-xl shadow p-8 border-l-4 border-amber-500">
        <p class="text-sm font-semibold text-amber-700">Erreur 404</p>
        <h1 class="mt-1 text-2xl font-bold text-slate-900">Page introuvable</h1>
        <p class="mt-4 text-slate-700">
            L'adresse <code class="rounded bg-slate-100 px-1" th:text="${path}">/adresse</code> ne correspond à aucune page du site.
        </p>
        <a th:href="@{/}"
           class="inline-block mt-6 rounded-lg bg-amber-600 px-4 py-2 text-white font-medium hover:bg-amber-700">
            Retour à l'accueil
        </a>
    </div>
</main>
</body>
</html>
