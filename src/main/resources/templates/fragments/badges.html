<!DOCTYPE html>
<!--/*
  Fragments réutilisables : des badges de couleur selon un statut.
  Utilisation : <span th:replace="~{fragments/badges :: statutCampagne(${campagne.statut})}"></span>

  Les paramètres s'appellent statutBadge (et non statut) : un paramètre de fragment masque une variable
  du modèle portant le même nom (piège de l'étape 1).
  Les classes Tailwind sont écrites EN ENTIER dans le template (et non construites par concaténation) :
  l'outil de build de Tailwind (étape 8) ne garde que les classes qu'il trouve telles quelles dans les fichiers.
*/-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="statutCampagne(statutBadge)">
    <span th:switch="${statutBadge.name()}">
        <span th:case="'BROUILLON'" class="rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700">Brouillon</span>
        <span th:case="'OUVERTE'" class="rounded-full bg-green-100 px-2 py-1 text-xs font-semibold text-green-800">Ouverte</span>
        <span th:case="'CLOTUREE'" class="rounded-full bg-blue-100 px-2 py-1 text-xs font-semibold text-blue-800">Clôturée</span>
        <span th:case="'ATTRIBUEE'" class="rounded-full bg-violet-100 px-2 py-1 text-xs font-semibold text-violet-800">Attribuée</span>
        <span th:case="'LIVREE'" class="rounded-full bg-emerald-100 px-2 py-1 text-xs font-semibold text-emerald-800">Livrée</span>
        <span th:case="'ANNULEE'" class="rounded-full bg-red-100 px-2 py-1 text-xs font-semibold text-red-800">Annulée</span>
    </span>
</th:block>

<th:block th:fragment="statutProposition(statutBadge)">
    <span th:switch="${statutBadge.name()}">
        <span th:case="'SOUMISE'" class="rounded-full bg-amber-100 px-2 py-1 text-xs font-semibold text-amber-800">Soumise</span>
        <span th:case="'RETENUE'" class="rounded-full bg-green-100 px-2 py-1 text-xs font-semibold text-green-800">Retenue</span>
        <span th:case="'REJETEE'" class="rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-600">Rejetée</span>
    </span>
</th:block>

<th:block th:fragment="statutParticipation(statutBadge)">
    <span th:switch="${statutBadge.name()}">
        <span th:case="'CONFIRMEE'" class="rounded-full bg-green-100 px-2 py-1 text-xs font-semibold text-green-800">Confirmée</span>
        <span th:case="'ANNULEE'" class="rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-600">Annulée</span>
    </span>
</th:block>

</body>
</html>
